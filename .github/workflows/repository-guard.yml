name: Repository Guard

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Verify repository integrity
      run: |
        test -f CMakeLists.txt
        test -f README.md
        test -f src/main.cpp
        test -f tests/smoke.cpp
        test -f assets/levels/quiet_station.json
        echo "Integrity check passed."
