name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Package Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build zip \
            libsdl2-dev libgl1-mesa-dev

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build engine and run tests
        run: |
          cmake --build build -j$(nproc)
          ctest --test-dir build --output-on-failure

      - name: Package with CPack
        run: |
          cd build
          cpack
          sha256sum vajra-tactical-engine-*.tar.gz vajra-tactical-engine-*.zip > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            build/vajra-tactical-engine-*.tar.gz
            build/vajra-tactical-engine-*.zip
            build/SHA256SUMS.txt
